[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = [ "core", "services", "repositories", "routes", "db", "scripts", "app.py", "main.py", "config.py",]

[tool.ruff.lint]
select = [ "E", "F", "W", "B", "I",]
ignore = [ "E501", "F401", "E402", "B008", "B904",]
exclude = [ ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "site-packages", "venv",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [ "tests",]
python_files = "test_*.py"

[tool.coverage.run]
branch = true
source = [ "core", "services", "repositories", "routes",]
omit = [ "tests/*", "scripts/*", "*/__init__.py", "venv/*", ".venv/*",]

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", "def __repr__", "if self.debug:", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", "pass", "except ImportError:",]
show_missing = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [ "E402",]
"app.py" = [ "E402",]
