<div id="tab-transporte" class="tab-content" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="color: white; margin: 0;">Evolución de Entregas</h2>
        <div class="radio-filter-group" style="margin: 0; flex-direction: row; gap: 10px;">
            <label>
                <input type="radio" name="transporte-time-filter" value="mensual" checked onchange="updateTransporteChartGroup('mensual')">
                <span>Mensual</span>
            </label>
            <label>
                <input type="radio" name="transporte-time-filter" value="semanal" onchange="updateTransporteChartGroup('semanal')">
                <span>Semanal</span>
            </label>
        </div>
    </div>

    <!-- Gráfico de Líneas -->
    <div class="chart-container" style="position: relative; height: 400px; width: 100%; margin-bottom: 2rem; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 15px;">
        <canvas id="transporteChart"></canvas>
    </div>

    <!-- Buscador de OT/GD/OC -->
    <div class="card" style="padding: 1.5rem; margin-bottom: 2rem;">
        <h3 style="color: var(--accent); margin-top: 0; margin-bottom: 1rem;">🔍 Búsqueda Rápida de Entregas</h3>
        <div style="position: relative; margin-bottom: 1rem;">
            <input type="text" id="transporteSearchInput" placeholder="Buscar por OT, GD o OC..." style="width: 100%; padding: 12px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; outline: none; font-size: 1rem;" onkeyup="searchTransporte()">
            <span id="transporteSearchLoading" style="position: absolute; right: 15px; top: 12px; display: none;">⏳</span>
        </div>
        <div style="overflow-x: auto;">
            <table class="data-table" id="transporteSearchTable" style="width: 100%; border-collapse: collapse; display: none;">
                <thead>
                    <tr>
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--calipso); font-weight: 600;">Fecha</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--calipso); font-weight: 600;">OT</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--calipso); font-weight: 600;">GD</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--calipso); font-weight: 600;">OC</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--calipso); font-weight: 600;">Proveedor</th>
                        <th style="padding: 12px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--calipso); font-weight: 600;">Bultos</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Llenado dinámico por JS -->
                </tbody>
            </table>
            <div id="transporteSearchNoResults" style="text-align: center; color: #94a3b8; padding: 1rem; display: none;">
                No se encontraron resultados para esta búsqueda.
            </div>
        </div>
    </div>

    <!-- Tabla de Datos y PDFs -->
    <div class="card" style="padding: 1.5rem;">
        <h3 style="color: var(--accent); margin-top: 0;">Registro Histórico y Reportes</h3>
        <div style="overflow-x: auto; margin-top: 1rem;">
            <table class="data-table" id="transporteTable" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--accent); font-weight: 600;">Fecha</th>
                        <th style="padding: 12px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--accent); font-weight: 600;">Total Entregas</th>
                        <th style="padding: 12px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--accent); font-weight: 600;">Total Bultos</th>
                        <th style="padding: 12px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.2); color: var(--accent); font-weight: 600;">Reporte Consolidado</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Llenado dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Visor PDF -->
    <div id="modalPdfViewer" class="pdf-modal">
        <div class="pdf-modal-content">
            <div class="pdf-modal-header">
                <h3 style="margin: 0; color: var(--accent);">📄 Visor de Reporte Consolidado</h3>
                <span class="pdf-close" onclick="closePdfViewer()">&times;</span>
            </div>
            <div style="flex: 1; position: relative;">
                <iframe id="pdfIframe" class="pdf-iframe" src=""></iframe>
            </div>
        </div>
    </div>
</div>
